<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Rungs favicon - a simplified vector echo of the new app icon (an
    athlete pressing a barbell overhead, ringed badge, warm orange). Kept as
    flat shapes rather than the full illustration so it stays crisp at
    16-32px browser-tab sizes, where the illustrated icon's fine linework
    would otherwise turn to noise.
  -->
  <defs>
    <linearGradient id="fav-bg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f6a13c"/>
      <stop offset="55%" stop-color="#ee7a1f"/>
      <stop offset="100%" stop-color="#d85a13"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fav-bg)"/>

  <!-- Ring badge -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#231609" stroke-width="16"/>

  <!-- Barbell -->
  <g fill="#231609">
    <rect x="120" y="168" width="272" height="22" rx="8"/>
    <rect x="96" y="140" width="30" height="78" rx="6"/>
    <rect x="70" y="152" width="18" height="54" rx="4"/>
    <rect x="386" y="140" width="30" height="78" rx="6"/>
    <rect x="424" y="152" width="18" height="54" rx="4"/>
  </g>

  <!-- Figure: head, raised arms, and torso, reduced to bold flat shapes. -->
  <g fill="#231609">
    <circle cx="256" cy="248" r="34"/>
    <path d="M180 190 q-18 46 6 90 l38-16 q-20-38-8-70 z"/>
    <path d="M332 190 q18 46-6 90 l-38-16 q20-38 8-70 z"/>
    <path d="M198 292 q58-30 116 0 l30 116 q-88 30-176 0 z"/>
  </g>
</svg>
